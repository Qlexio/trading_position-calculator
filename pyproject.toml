[project]
name = "trading-position-calculator"
version = "0.1.0"
description = "Locally hosted web app for trading-position calculations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.163.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.33",
    "uvicorn>=0.54.0",
]

[project.scripts]
trading-position-calculator = "trading_position_calculator.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
src = ["src", "tests"]
