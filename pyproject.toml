[project]
name = "workspace"
version = "0.1.0"
description = "A small Python project."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
workspace = "workspace:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
